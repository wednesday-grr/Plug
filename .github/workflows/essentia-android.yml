name: Build Essentia for Android

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/essentia-android.yml"
      - ".github/essentia/**"
      - "app/src/main/cpp/**"
      - "app/build.gradle.kts"
  push:
    branches: [ "beta" ]
    paths:
      - ".github/workflows/essentia-android.yml"
      - ".github/essentia/**"
      - "app/src/main/cpp/**"
      - "app/build.gradle.kts"

permissions:
  contents: read

jobs:
  build:
    name: Essentia ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
            machine: AArch64
          - abi: armeabi-v7a
            target: armv7a-linux-androideabi
            machine: ARM
          - abi: x86
            target: i686-linux-android
            machine: Intel 80386
          - abi: x86_64
            target: x86_64-linux-android
            machine: Advanced Micro Devices X86-64
    env:
      NDK_VERSION: 27.2.12479018
      ANDROID_API: "23"
      ESSENTIA_COMMIT: df27f949d7827a43b4afc216fd5c788454b0f8a4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: MTG/essentia
          ref: df27f949d7827a43b4afc216fd5c788454b0f8a4
          path: essentia-source
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libeigen3-dev pkg-config
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"

      - name: Configure and build
        env:
          ABI: ${{ matrix.abi }}
          TARGET: ${{ matrix.target }}
        run: bash .github/essentia/build-android.sh

      - name: Verify architecture and link
        env:
          ABI: ${{ matrix.abi }}
          TARGET: ${{ matrix.target }}
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: bash .github/essentia/verify-android.sh

      - uses: actions/upload-artifact@v4
        with:
          name: essentia-android-${{ matrix.abi }}
          path: essentia-artifacts/${{ matrix.abi }}/
          if-no-files-found: error
          retention-days: 30

  app:
    name: Build app with Essentia
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle
      - uses: actions/download-artifact@v4
        with:
          pattern: essentia-android-*
          path: downloaded-essentia
      - name: Install native artifacts
        run: |
          mkdir -p app/essentia-artifacts
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            test -f "downloaded-essentia/essentia-android-$abi/lib/libessentia.a"
            mv "downloaded-essentia/essentia-android-$abi" "app/essentia-artifacts/$abi"
          done
      - name: Set up Android build
        run: |
          echo releaseType=CI > package.properties
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug -PuseEssentia=true --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: gramophone-essentia-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
